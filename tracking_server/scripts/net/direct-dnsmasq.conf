# LWIR direct cable port: DHCP + captive-portal DNS. Our own dnsmasq instance (see lwir-direct-link.service), NOT NetworkManager's
# "shared" mode: shared mode keeps only one address on the port (the team link 192.168.50.2 would vanish), switches on IP
# forwarding + NAT (a PC on the cable could reach the other port / Tailscale through the board) and reads its extra
# configuration from a global drop-in directory. This instance listens on 10.42.0.1 only, gives no router, forwards nothing.
#
# The address 10.42.0.1 itself is assigned by the NetworkManager profile 'lwir-direct-link' (scripts/net/nm_direct_profile.sh).

port=53
# bind-dynamic: starts even while 10.42.0.1 is not assigned yet (cable out / boot) and binds by itself when it appears
bind-dynamic
listen-address=10.42.0.1
except-interface=lo
no-resolv
no-hosts
no-poll
domain-needed
bogus-priv

# DHCP: a PC that is set to "obtain an address automatically" gets 10.42.0.x. No router option (the PC keeps its own internet
# route, e.g. Wi-Fi); the DNS server is this board (only the connectivity-check names below are answered, the rest is refused).
dhcp-range=10.42.0.20,10.42.0.200,255.255.255.0,1h
dhcp-authoritative
dhcp-option=3
dhcp-option=option:dns-server,10.42.0.1
dhcp-leasefile=/var/lib/misc/lwir-direct.leases
pid-file=/run/lwir-direct-dnsmasq.pid

# Connectivity checks of the operating systems -> this board. The responder (src/net/portal.py, started by lwir_netd) turns them
# into "this network needs a sign-in" and the PC opens the page (Windows: browser opens at http://www.msftconnecttest.com/redirect).
address=/www.msftconnecttest.com/10.42.0.1
address=/www.msftncsi.com/10.42.0.1
# Windows' DNS check: dns.msftncsi.com must resolve to 131.107.255.255 (Microsoft's documented answer); nothing connects there.
address=/dns.msftncsi.com/131.107.255.255
address=/captive.apple.com/10.42.0.1
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/edge-http.microsoft.com/10.42.0.1
address=/detectportal.firefox.com/10.42.0.1
address=/nmcheck.gnome.org/10.42.0.1
address=/connectivity-check.ubuntu.com/10.42.0.1
